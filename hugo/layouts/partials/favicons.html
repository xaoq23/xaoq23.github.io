{{/*
  Project favicon override.

  Blowfish uses `partials/favicons.html` when it exists instead of its own

*/}}
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">

<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
