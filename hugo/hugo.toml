# Site configuration — Hugo owns all content, routing and static HTML.
# React islands are mounted only on elements Hugo marks with data-island.
#
# The site is bilingual: both languages live in peer subpaths, `/en/` and
# `/zh/`. The repo-root `/` is a tiny static redirect (hugo/static/index.html).
# Translations are sibling files with a `.zh.md` suffix, so a missing
# translation is obvious in the content tree.

baseURL = "https://xaoq23.github.io/"
title = "xaoq23"
theme = "blowfish"

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    ordered = false
    startLevel = 2
    endLevel = 3

# ---------------------------------------------------------------------------
# Shared parameters (apply to every language)
# ---------------------------------------------------------------------------
[params]
  colorScheme = "blowfish"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  fingerprintAlgorithm = "sha256"
  disableImageZoom = true
  enableSearch = false
  enableCodeCopy = true
  enableStyledScrollbar = false

  [params.header]
    layout = "basic"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.article]
    showDate = true
    showAuthor = true
    showReadingTime = true
    showWordCount = false
    showBreadcrumbs = false
    showTableOfContents = true
    showTaxonomies = true
    showHero = false
    showZenMode = false
    showReadingProgress = true

  [params.list]
    showHero = false

  # Personal information. `email` is rendered by the homepage, the about page
  # and Blowfish's author block (via the email entry in `links`).
  [params.author]
    name = "xaoq23"
    email = "2105002580@qq.com"
    links = [
      # `mailto:` prefix matters: Blowfish skips mailto links when emitting
      # <link rel="me">, and its email.js handles both forms.
      { email = "mailto:2105002580@qq.com" },
      { github = "https://github.com/xaoq23" },
    ]

# ---------------------------------------------------------------------------
# Languages
# ---------------------------------------------------------------------------
[languages]

  [languages.en]
    label = "English"
    languageCode = "en-US"
    locale = "en-US"
    contentDir = "content"
    weight = 1
    title = "xaoq23"

    [languages.en.params]
      displayName = "EN"
      isoCode = "en-US"
      dateFormat = "2 January 2006"
      description = "A personal blog recording baffling thoughts."

      [languages.en.params.hero]
        eyebrow = "Notes"
        title = "Global Coding Skills Dropped 10,000× — Only I Stayed the Same?!"
        lede = "A personal blog recording baffling thoughts."

      [languages.en.params.author]
        headline = "Global Coding Skills Dropped 10,000× — Only I Stayed the Same?!"
        bio = "Notes on programming, tooling and building things on the web."

    [[languages.en.menus.main]]
      name = "Posts"
      pageRef = "posts"
      weight = 10

    [[languages.en.menus.main]]
      name = "About"
      pageRef = "about"
      weight = 20

  [languages.zh]
    label = "中文"
    languageCode = "zh-CN"
    locale = "zh-CN"
    contentDir = "content"
    weight = 2
    title = "xaoq23 · 笔记"

    [languages.zh.params]
      displayName = "中文"
      isoCode = "zh-CN"
      dateFormat = "2006年1月2日"
      description = "个人blog网站，记录莫名其妙的思考。"

      [languages.zh.params.hero]
        eyebrow = "笔记"
        title = "全球编程能力下降一万倍，只有我保持不变？！"
        lede = "个人blog网站记录莫名其妙的思考"

      [languages.zh.params.author]
        headline = "全球编程能力下降一万倍，只有我保持不变？！"
        bio = "记录编程、工具与 Web 构建中那些莫名其妙的思考。"

    [[languages.zh.menus.main]]
      name = "文章"
      pageRef = "posts"
      weight = 10

    [[languages.zh.menus.main]]
      name = "关于"
      pageRef = "about"
      weight = 20
