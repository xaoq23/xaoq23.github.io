# pnpm settings for the islands project.
#
# 1. nodeLinker: the default `isolated` layout creates Windows junctions that
#    Node's ESM resolver does not follow here, so Vite's own dependency
#    `rolldown` is reported as missing. A flat layout avoids that.
# 2. packageImportMethod: hardlink imports crash pnpm's installer on the
#    current Node 25 / pnpm 12 / Windows combination. Copying is slower but
#    reliable, and CI on Linux is unaffected.
nodeLinker: hoisted
packageImportMethod: copy
